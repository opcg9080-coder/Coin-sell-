<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Exchange - Premium Asset Portal</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="app-sidebar">
            <div class="sidebar-brand">
                <div class="brand-logo"></div>
                <h1>Coin Exchange</h1>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-link active" data-view="dashboard">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    <span>Home</span>
                </button>
                <button class="nav-link" data-view="wallet">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
                    <span>Wallet</span>
                </button>
                <button class="nav-link" data-view="exchange">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                    <span>Exchange</span>
                </button>
                <button class="nav-link" data-view="share">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" width="4" height="4" r="3"></circle><circle cx="6" cy="12" width="4" height="4" r="3"></circle><circle cx="18" cy="19" width="4" height="4" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    <span>Share Coin</span>
                </button>
                <button class="nav-link" data-view="new-coin">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                    <span>New Coin</span>
                </button>
                <button class="nav-link" data-view="notifications">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <span>Notifications</span>
                    <span class="notification-badge hidden" id="global-badge">0</span>
                </button>
                <button class="nav-link" data-view="profile">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span>Profile</span>
                </button>
                <button class="nav-link" data-view="history">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span>History</span>
                </button>
            </nav>
        </aside>

        <!-- Main Workspace -->
        <div class="app-main">
            <!-- Top Header Bar -->
            <header class="app-header">
                <button class="mobile-toggle" id="sidebar-toggle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="header-breadcrumb">
                    <span id="current-view-title">Home</span>
                </div>
                <div class="header-status">
                    <div class="user-status-card">
                        <span class="status-label">User ID:</span>
                        <span class="status-value" id="header-user-id">---</span>
                    </div>
                </div>
            </header>

            <!-- Dynamic View Containers -->
            <main class="app-content">
                <!-- Home View -->
                <section id="view-dashboard" class="content-view active">
                    <div class="view-header">
                        <h2>Dashboard Overview</h2>
                    </div>
                    <div class="metrics-grid">
                        <div class="metric-card gold-gradient">
                            <div class="metric-header">
                                <span>Gold Coin Balance</span>
                                <div class="coin-symbol gold-symbol">GC</div>
                            </div>
                            <div class="metric-value" id="dash-gold-balance">0.00</div>
                        </div>
                        <div class="metric-card purple-gradient">
                            <div class="metric-header">
                                <span>Purple Coin Balance</span>
                                <div class="coin-symbol purple-symbol">PC</div>
                            </div>
                            <div class="metric-value" id="dash-purple-balance">0.00</div>
                        </div>
                    </div>
                    <div class="dashboard-split">
                        <div class="panel-card">
                            <h3>Quick Actions</h3>
                            <div class="actions-grid">
                                <button class="action-btn-shortcut" data-target="exchange">Go to Exchange</button>
                                <button class="action-btn-shortcut" data-target="share">Transfer Assets</button>
                            </div>
                        </div>
                        <div class="panel-card">
                            <h3>Recent System Updates</h3>
                            <div class="update-list" id="dash-update-list">
                                <!-- Populated dynamically -->
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Wallet View -->
                <section id="view-wallet" class="content-view">
                    <div class="view-header">
                        <h2>Asset Wallet</h2>
                    </div>
                    <div class="wallet-container">
                        <div class="wallet-asset-card">
                            <div class="asset-meta">
                                <div class="asset-icon gold-bg"></div>
                                <div>
                                    <h4>Gold Coin</h4>
                                    <p class="asset-ticker">GC</p>
                                </div>
                            </div>
                            <div class="asset-balance">
                                <span class="balance-amount" id="wallet-gold-amount">0.00</span>
                                <span class="balance-label">Available Balance</span>
                            </div>
                        </div>
                        <div class="wallet-asset-card">
                            <div class="asset-meta">
                                <div class="asset-icon purple-bg"></div>
                                <div>
                                    <h4>Purple Coin</h4>
                                    <p class="asset-ticker">PC</p>
                                </div>
                            </div>
                            <div class="asset-balance">
                                <span class="balance-amount" id="wallet-purple-amount">0.00</span>
                                <span class="balance-label">Available Balance</span>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Exchange View -->
                <section id="view-exchange" class="content-view">
                    <div class="view-header">
                        <h2>Convert Assets</h2>
                    </div>
                    <div class="form-container-split">
                        <div class="panel-card">
                            <form id="exchange-form" novalidate>
                                <div class="form-group">
                                    <label for="exchange-direction">Direction</label>
                                    <select id="exchange-direction" class="form-select">
                                        <option value="gold_to_purple">Gold Coin &rarr; Purple Coin</option>
                                        <option value="purple_to_gold">Purple Coin &rarr; Gold Coin</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="exchange-quantity">Quantity</label>
                                    <input type="number" id="exchange-quantity" class="form-input" placeholder="0.00" min="0.01" step="any" required>
                                </div>
                                <div class="exchange-preview-box">
